---
- name: Bootstrap
  hosts: localhost
  become: true
  ignore_unreachable: false
  vars_files:
    - inventory/group_vars/vault.yaml
  roles:
    - role: updates
    - role: bootstrap
    - role: docker
      when: enable_nebula_sync
    - role: firewalld
      when: ansible_os_family == "RedHat" and 'firewalld.service' in ansible_facts.services
    - role: keepalived
      when: enable_keepalived
    - role: unbound
      when: enable_unbound
    - role: pihole
    - role: nebula_sync
      when: enable_nebula_sync
    - role: pihole_updatelists
      when: enable_pihole_updatelists
    - role: status
